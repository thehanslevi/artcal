    </pattern>
    <path id="t" d="M975.3 540.6 L1026.8 547.6 L1100 600 L1026.8 652.4 L975.3 659.4 L839.1 895.3 L858.8 943.4 L850 1033 L768 995.8 L736.2 954.8 L463.8 954.8 L432 995.8 L350 1033 L341.2 943.4 L360.9 895.3 L224.7 659.4 L173.2 652.4 L100 600 L173.2 547.6 L224.7 540.6 L360.9 304.7 L341.2 256.6 L350 167 L432 204.2 L463.8 245.2 L736.2 245.2 L768 204.2 L850 167 L858.8 256.6 L839.1 304.7 Z"/>
    <clipPath id="c"><circle cx="600" cy="600" r="330"/></clipPath>
