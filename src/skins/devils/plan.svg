  <!-- moat -->
  <use href="#t" transform="translate(600 600) scale(1.08) translate(-600 -600)" fill="none" stroke="url(#h)" stroke-width="44"/>
  <use href="#t" transform="translate(600 600) scale(1.13) translate(-600 -600)" fill="none" stroke="#000" stroke-width="1"/>
