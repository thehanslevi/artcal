  <use href="#t" transform="translate(600 600) scale(.94) translate(-600 -600)" fill="none" stroke="#000" stroke-width="1"/>
  <!-- streets -->
  <g clip-path="url(#c)" stroke="#000" stroke-width=".6" fill="none">
    <path d="M300 270V930M360 270V930M420 270V930M480 270V930M540 270V930M600 270V930M660 270V930M720 270V930M780 270V930M840 270V930M900 270V930M270 300H930M270 360H930M270 420H930M270 480H930M270 540H930M270 600H930M270 660H930M270 720H930M270 780H930M270 840H930M270 900H930"/>
  </g>
  <!-- the market: one solid square -->
  <rect x="560" y="560" width="80" height="80" fill="#000"/>
  <!-- the convent: cloister with hatched court -->
  <rect x="400" y="440" width="170" height="130" fill="none" stroke="#000" stroke-width="1.4"/>
  <rect x="440" y="470" width="90" height="70" fill="url(#h)" stroke="#000" stroke-width="1"/>
